<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F1F8FA">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Money Tracker">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Money Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=5">
  <link rel="apple-touch-icon" href="icon.png">
</head>
<body>
  <div id="app">

    <section id="today" class="screen active">
      <h1 id="listDate"></h1>
      <div class="hero">
        <div class="hero-label">Spent today</div>
        <div id="dayTotal" class="hero-total">₱0</div>
      </div>
      <h2>Entries</h2>
      <ul id="list"></ul>
    </section>

<section id="stats" class="screen">
  <h1>Stats</h1>

  <div class="month-switch">
    <button id="prevMonth" aria-label="Previous month">‹</button>
    <button id="monthLabel" class="month-btn" aria-haspopup="dialog"></button>    <button id="nextMonth" aria-label="Next month">›</button>
  </div>

  <div class="stat-row">
    <div class="stat dark">
      <div class="stat-label">Daily average</div>
      <div id="avgVal" class="stat-val">₱0</div>
    </div>
    <div class="stat light">
      <div class="stat-label">Total spent</div>
      <div id="totalVal" class="stat-val">₱0</div>
      <div id="pctBadge" class="badge"></div>
    </div>
  </div>
  <p id="compareNote" class="note"></p>

  <div class="stat-card">
    <h2>By category</h2>
    <div id="catList"></div>
  </div>
</section>

    <section id="categories" class="screen">
      <h1>Categories</h1>
      <p class="empty">Coming soon.</p>
    </section>

    <section id="you" class="screen">
    <h1>You</h1>
    <div class="stat-card">
        <h2>Backup</h2>
        <p class="note">Save a copy of all your expenses. Do this once in a while.</p>
        <button class="primary" id="exportBtn">Export backup</button>
        <button class="soft" id="importBtn">Import backup</button>
        <input type="file" id="importFile" accept="application/json,.json" hidden>
        <p id="backupMsg" class="note" role="status"></p>
    </div>
    </section>

  </div>

  <nav>
    <button class="fab" id="addBtn" aria-label="Add expense">+</button>
    <button class="tab active" data-screen="today">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8v10H3z"/></svg>Today
    </button>
    <button class="tab" data-screen="stats">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/></svg>Stats
    </button>
    <button class="tab" data-screen="categories">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Categories
    </button>
    <button class="tab" data-screen="you">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 12a4 4 0 100-8 4 4 0 000 8zM4 21c0-4 4-6 8-6s8 2 8 6"/></svg>You
    </button>
  </nav>

  <div id="sheet" class="sheet">
    <div class="backdrop" id="backdrop"></div>
    <div class="panel">
      <h2 id="sheetTitle">New expenses</h2>
      <div class="hero">
        <label for="amount" class="hero-label">Amount</label>
        <div class="amount-row">
          <span>₱</span>
          <input id="amount" type="number" inputmode="decimal" placeholder="0">
        </div>
      </div>
      <label for="item">What was it for?</label>
      <input id="item" type="text" placeholder="e.g. Lunch">
      <label for="category">Category</label>
      <input id="category" type="text" placeholder="e.g. Food">
      <div id="suggestions" class="chips"></div>
      <button class="primary" id="saveBtn">Save expense</button>
      <button class="ghost" id="cancelBtn">Cancel</button>
    </div>
  </div>

    <div id="confirm" class="confirm" role="alertdialog" aria-modal="true" aria-labelledby="confirmTitle">
    <div class="confirm-backdrop"></div>
    <div class="confirm-box">
        <h2 id="confirmTitle">Delete this expense?</h2>
        <p id="confirmText"></p>
        <button class="danger" id="confirmYes">Delete</button>
        <button class="ghost" id="confirmNo">Keep it</button>
    </div>
</div>

<div id="picker" class="sheet" role="dialog" aria-modal="true" aria-label="Pick a month">
  <div class="backdrop" id="pickerBackdrop"></div>
  <div class="panel">
    <div class="year-row">
      <button id="prevYear" aria-label="Previous year">‹</button>
      <h2 id="yearLabel"></h2>
      <button id="nextYear" aria-label="Next year">›</button>
    </div>
    <div id="monthGrid" class="month-grid"></div>
    <button class="soft" id="pickerClose">Close</button>
  </div>
</div>

  <script src="app.js?v=5"></script>
</body>
</html>
